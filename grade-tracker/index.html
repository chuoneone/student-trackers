<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MixFlow 學生小考成績登記系統</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css?v=5">
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
  <div class="background-decorations">
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>
  </div>

  <!-- Main System App -->
  <div id="mainApp" class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="logo-icon">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <div>
          <h1>學生小考成績登記系統</h1>
          <p class="subtitle">Student Grade Tracking & Analytics</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="themeToggleBtn" class="action-btn" title="切換主題">
          <i class="fa-solid fa-sun"></i>
        </button>
        <button id="refreshBtn" class="action-btn" title="同步資料">
          <i class="fa-solid fa-rotate"></i>
        </button>
      </div>
    </header>

    <!-- Class Selector Tabs -->
    <section class="class-selector-section">
      <div class="class-tabs">
        <button class="class-tab-btn active" data-grade="七年級">
          <i class="fa-solid fa-users-rectangle"></i> 七年級
        </button>
        <button class="class-tab-btn" data-grade="八年級">
          <i class="fa-solid fa-users-rectangle"></i> 八年級
        </button>
      </div>
    </section>

    <!-- Main Workspace Navigation -->
    <nav class="main-navigation card-glass">
      <button class="nav-tab active" data-tab="registration">
        <i class="fa-solid fa-pen-to-square"></i> 登記成績
      </button>
      <button class="nav-tab" data-tab="trend">
        <i class="fa-solid fa-chart-line"></i> 學生個人進步趨勢
      </button>
      <button class="nav-tab" data-tab="roster">
        <i class="fa-solid fa-users"></i> 學生名單 <span id="studentCountBadge" class="badge">0</span>
      </button>
      <button class="nav-tab" data-tab="distribution">
        <i class="fa-solid fa-chart-bar"></i> 學生個人成績分佈圖
      </button>
      <button class="nav-tab" data-tab="history">
        <i class="fa-solid fa-clock-rotate-left"></i> 全體歷次小考紀錄
      </button>
    </nav>

    <!-- Main Workspace Area -->
    <div class="main-workspace">
      
      <!-- Page 1: Grade Registration Form -->
      <section id="page-registration" class="tab-page">
        <div class="card-glass" style="padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem;">
          <div class="form-group-row">
            <div class="form-group">
              <label for="dashDate">日期</label>
              <input type="date" id="dashDate" required>
            </div>
            <div class="form-group" style="flex: 2;">
              <label for="dashSubject">小考科目 / 單元名稱</label>
              <div class="input-with-icon">
                <i class="fa-solid fa-book-open"></i>
                <input type="text" id="dashSubject" placeholder="例如：數學小考一、5-1單元" required maxlength="20">
              </div>
            </div>
          </div>

          <!-- Student Table -->
          <div class="batch-table-container">
            <table class="batch-table">
              <thead>
                <tr>
                  <th style="text-align: left; padding: 0.5rem 0.75rem;">學生姓名</th>
                  <th style="text-align: left; padding: 0.5rem 0.75rem; width: 100px;">得分</th>
                  <th style="text-align: left; padding: 0.5rem 0.75rem; width: 280px;">IEP 協助程度 (可複選)</th>
                  <th style="text-align: left; padding: 0.5rem 0.75rem;">備註</th>
                </tr>
              </thead>
              <tbody id="dashStudentListBody">
                <!-- Dynamically populated rows -->
              </tbody>
            </table>
          </div>

          <div class="form-actions" style="margin-top: 0.5rem; border-top: 1px solid var(--panel-border); padding-top: 1rem;">
            <button type="button" id="saveDashBtn" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.7rem;">
              <span id="dashBtnText">儲存成績</span>
              <span id="dashBtnLoader" class="loader hidden"></span>
            </button>
          </div>
        </div>
      </section>

      <!-- Page 2: Student Progress Trend -->
      <section id="page-trend" class="tab-page hidden">
        <div class="card-glass analytics-card">
          <div class="section-header">
            <h3><i class="fa-solid fa-chart-line"></i> 學生個人成績進步趨勢</h3>
          </div>
          <div class="chart-container">
            <canvas id="gradeTrendChart"></canvas>
            <div id="noTrendChartData" class="no-data-placeholder hidden">
              <i class="fa-solid fa-inbox"></i>
              <p>目前尚無小考成績數據</p>
            </div>
          </div>
        </div>
      </section>

      <!-- Page 3: Student Roster Cards -->
      <section id="page-roster" class="tab-page hidden">
        <div id="studentsGrid" class="students-grid">
          <!-- Dynamically populated -->
        </div>
      </section>

      <!-- Page 4: Student Grade Range Distribution -->
      <section id="page-distribution" class="tab-page hidden">
        <div class="card-glass analytics-card">
          <div class="section-header">
            <h3><i class="fa-solid fa-chart-bar"></i> 學生個人成績分佈圖</h3>
          </div>
          <div class="chart-container">
            <canvas id="gradeDistChart"></canvas>
            <div id="noDistChartData" class="no-data-placeholder hidden">
              <i class="fa-solid fa-face-meh"></i>
              <p>尚未有任何登記的小考成績</p>
            </div>
          </div>
        </div>
      </section>

      <!-- Page 5: History Records -->
      <section id="page-history" class="tab-page hidden">
        <div class="card-glass history-card">
          <div class="section-header">
            <h3><i class="fa-solid fa-clock-rotate-left"></i> 全體歷次小考紀錄</h3>
            <div class="search-box">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input type="text" id="searchInput" placeholder="搜尋學生姓名或小考科目...">
            </div>
          </div>
          <div class="history-list-container">
            <ul id="historyList" class="history-list">
              <!-- Dynamically populated -->
            </ul>
            <div id="noHistoryData" class="no-data-placeholder">
              <i class="fa-solid fa-folder-open"></i>
              <p>目前尚無成績紀錄</p>
            </div>
          </div>
        </div>
      </section>

    </div>
  </div>

  <!-- Record Grade Modal -->
  <div id="recordModal" class="modal-overlay">
    <div class="modal-card card-glass">
      <div class="modal-header">
        <h3><i class="fa-solid fa-list-check"></i> 個人小考成績明細</h3>
        <button id="closeRecordModalBtn" class="close-btn">&times;</button>
      </div>
      <div class="modal-body-split">
        
        <!-- Left Pane: Add Score Form -->
        <form id="recordForm" class="modal-form-pane hidden">
          <div class="form-group-row">
            <div class="form-group">
              <label>學生姓名</label>
              <input type="text" id="recordStudentName" readonly class="readonly-input">
            </div>
            <div class="form-group">
              <label for="recordDate">日期</label>
              <input type="date" id="recordDate" required>
            </div>
          </div>

          <div class="form-group">
            <label for="gradeSubject">小考科目 / 單元名稱</label>
            <div class="input-with-icon">
              <i class="fa-solid fa-book-open"></i>
              <input type="text" id="gradeSubject" placeholder="例如：數學小考一、L1單字" required maxlength="20">
            </div>
          </div>

          <div class="form-group">
            <label for="gradeScore">小考得分 (0 - 100)</label>
            <div class="input-with-icon">
              <i class="fa-solid fa-star"></i>
              <input type="number" id="gradeScore" placeholder="輸入分數 (0 - 100)" min="0" max="100" required>
            </div>
          </div>

          <div class="form-group">
            <label>IEP 協助程度 / 提示層次 (可複選)</label>
            <div id="supportLevelChips" class="chips-container">
              <button type="button" class="chip-btn active" data-value="完全獨立">完全獨立</button>
              <button type="button" class="chip-btn" data-value="口語提示">口語提示</button>
              <button type="button" class="chip-btn" data-value="視覺提示">視覺提示</button>
              <button type="button" class="chip-btn" data-value="手勢提示">手勢提示</button>
              <button type="button" class="chip-btn" data-value="動作示範">動作示範</button>
              <button type="button" class="chip-btn" data-value="肢體協助">肢體協助</button>
            </div>
            <input type="hidden" id="supportLevel" value="完全獨立">
          </div>

          <div class="form-group">
            <label for="recordNote">備註（如學習狀況、需加強之處）</label>
            <textarea id="recordNote" placeholder="輸入紀錄備註（非必填）" rows="3"></textarea>
          </div>

          <div class="form-actions">
            <button type="button" id="cancelRecordBtn" class="btn btn-secondary">取消</button>
            <button type="submit" id="saveRecordBtn" class="btn btn-primary">
              <span id="btnText">儲存成績</span>
              <span id="btnLoader" class="loader hidden"></span>
            </button>
          </div>
        </form>

        <!-- Right Pane: Student Personal History -->
        <div class="modal-history-pane">
          <h4><i class="fa-solid fa-list-check"></i> 個人成績明細</h4>
          <div class="personal-history-container">
            <ul id="personalHistoryList" class="personal-history-list">
              <!-- Dynamically populated -->
            </ul>
            <div id="noPersonalHistory" class="no-data-placeholder">
              <i class="fa-solid fa-inbox"></i>
              <p>尚未登記任何小考</p>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Notification Toast -->
  <div id="toast" class="toast hidden"></div>

  <!-- Main Logic -->
  <script type="module" src="app.js?v=5"></script>
</body>
</html>
